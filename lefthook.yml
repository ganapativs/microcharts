# Git hooks (Go-native, no husky). Runs fast checks locally; CI is the gate of record.
pre-commit:
  parallel: true
  commands:
    format:
      # oxfmt owns code (.mjs/.cjs/.mts incl.); prettier owns md/mdx (see `format-docs`)
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,css}"
      # tolerate an all-ignored set, same as `lint` below: the glob matches
      # `*.generated.{ts,json}`, which `.oxfmtrc.json` ignores, so a commit
      # touching only generated output gave oxfmt zero targets and it exited 2
      # — blocking the commit outright.
      run: pnpm oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    format-docs:
      # prettier formats markdown/mdx prose (proseWrap), auto-fixes and re-stages
      glob: "*.{md,mdx}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx}"
      # tolerate an all-ignored set (e.g. only fixtures/** staged)
      run: pnpm oxlint --no-error-on-unmatched-pattern {staged_files}

pre-push:
  # Sequential (piped), not parallel: typecheck, then the node-env + jsdom
  # projects, then the browser (Playwright) project. The jsdom project peaks
  # ~0.7 GB — well under a worker's 4 GB V8 heap. (It used to OOM, but the cause
  # was a single chart emitting unbounded geometry on a non-physical input, not
  # the suite size — fixed in wind-barb/geometry.ts.)
  piped: true
  commands:
    # First, because it is the cheapest way to be wrong: every committed
    # generated artifact is regenerated and diffed (~7 s, build included). A
    # failure has already written the correct files — commit them and push again.
    # CI runs the identical check, so a stale artifact can never reach main.
    0_generated:
      run: pnpm gen:check
    1_typecheck:
      run: pnpm typecheck
    2_test_node:
      run: pnpm vitest run --project core --project dom
    # ~2 s, and the only guard on the docs-side derived numbers (hero specimen
    # literals, catalog.json, llms.txt, prose claims).
    3_test_docs:
      run: pnpm --filter @microcharts/docs test
    4_test_browser:
      run: pnpm vitest run --project browser
