# Git hooks (Go-native, no husky). Runs fast checks locally; CI is the gate of record.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm oxfmt --check {staged_files}
    lint:
      glob: "*.{ts,tsx}"
      # tolerate an all-ignored set (e.g. only fixtures/** staged)
      run: pnpm oxlint --no-error-on-unmatched-pattern {staged_files}

pre-push:
  # Sequential (piped), not parallel. The ~2.1k-file jsdom (node) project
  # accumulates past a worker fork's fixed 4 GB V8 heap (execArgv/poolOptions is
  # not honored in vitest 4 project config), so run it in 3 fresh shards — each
  # holds few enough files to stay well under the ceiling — then the browser
  # project. Running these in parallel or in one process OOMs.
  piped: true
  commands:
    1_typecheck:
      run: pnpm typecheck
    2_test_node_1:
      run: pnpm vitest run --project node --shard=1/3
    3_test_node_2:
      run: pnpm vitest run --project node --shard=2/3
    4_test_node_3:
      run: pnpm vitest run --project node --shard=3/3
    5_test_browser:
      run: pnpm vitest run --project browser
