name: Visual

# Runs on PRs + every main push. Argos stores + diffs baselines in the cloud
# (needs the ARGOS_TOKEN secret). Main pushes refresh the reference build so PRs
# always diff against current main, not a frozen manual dispatch. Manual kept.
#
# Path-filtered to what can actually change a rendered chart (source, styles,
# the specs, the build/runner config) so docs-only or tooling-only PRs don't
# spend Argos screenshots — the free plan caps at 5,000/month. Combined with the
# single-project light+dark capture (tests/visual/_fixtures.ts), a build uploads
# 104 screenshots, not 208.
on:
  push:
    branches: [main]
    paths: &visual_paths
      - "src/**"
      - "styles.css"
      - "tests/visual/**"
      - "playwright.config.ts"
      - "tsdown.config.ts"
      - ".github/workflows/visual.yml"
  pull_request:
    paths: *visual_paths
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels an in-flight visual run so rapid
# iteration doesn't stack full builds against the screenshot quota.
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    # Pinned to the Playwright release matching @playwright/test so baselines
    # render byte-identical to local generation.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # Argos needs history to diff against the base
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run visual specs + upload to Argos
        run: pnpm test:visual
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
