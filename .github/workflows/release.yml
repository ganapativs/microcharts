name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# No token: publishing uses npm **trusted publishing** (OIDC) + automatic
# provenance. Requires a one-time setup on npmjs.org: add this repo + workflow
# as a Trusted Publisher for @microcharts/react. If you ever need the classic
# path instead, add an NPM_TOKEN secret and set it as NODE_AUTH_TOKEN below.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the version PR / tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Pinned to the npm 11 line: OIDC trusted publishing needs npm >= 11.5,
      # but `npm@latest` broke @changesets/cli's publish-error parsing (it
      # crashes in isAlreadyPublishedError with a TypeError and masks the real
      # npm error — seen 2026-07-10, run 29073720208). Bump the pin only after
      # verifying changesets parses that npm major's error output.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
