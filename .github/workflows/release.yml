name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# No token: publishing uses npm **trusted publishing** (OIDC) + automatic
# provenance. Requires a one-time setup on npmjs.org: add this repo + workflow
# as a Trusted Publisher for @microcharts/react. If you ever need the classic
# path instead, add an NPM_TOKEN secret and set it as NODE_AUTH_TOKEN below.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the version PR / tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Pinned to the npm 11 line: OIDC trusted publishing needs npm >= 11.5,
      # but `npm@latest` broke @changesets/cli's publish-error parsing (it
      # crashes in isAlreadyPublishedError with a TypeError and masks the real
      # npm error — seen 2026-07-10, run 29073720208). Bump the pin only after
      # verifying changesets parses that npm major's error output.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # When @microcharts/mcp was just published to npm, register the pointer in
      # the official MCP registry (Smithery / mcp.so / Glama crawl from there, so
      # this one step feeds every directory). Auth is GitHub OIDC via the job's
      # id-token permission — no token. server.json's version is synced to the
      # published package version first so the registry never lags npm.
      # One-time setup required: verify the `io.github.ganapativs` namespace on
      # registry.modelcontextprotocol.io. Skipped automatically when only the
      # library published (or on a version-PR run).
      # NOTE the two output names. changesets/action v1.9.0 (the pinned SHA above)
      # emits `publishedPackages`; a later version renamed it to
      # `published-packages`. Reading only one would make this step silently stop
      # firing on an action bump — a skipped step looks identical to "the library
      # released on its own", so it would go unnoticed. Check both.
      - name: Publish to the MCP registry
        if: >-
          steps.changesets.outputs.published == 'true' &&
          contains(
            format('{0}{1}',
              steps.changesets.outputs.publishedPackages,
              steps.changesets.outputs['published-packages']),
            '@microcharts/mcp')
        working-directory: packages/mcp
        run: |
          # The `version` script already synced this in the release PR; re-run so a
          # hand-edited bump can't publish a manifest pointing at a version that
          # isn't on npm.
          node ../../scripts/sync-server-json.mjs
          # Download to a file, then extract: piping into `tar xz <member>` makes
          # tar close the stream at the member it wants and curl dies on the
          # broken pipe. The arch map covers arm runners too.
          asset="mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/${asset}"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          # Cheap pre-flight: a schema error here names the field, where a failed
          # publish just returns a rejection.
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
