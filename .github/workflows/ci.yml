name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm knip
      - run: pnpm size
      # generated files must match their sources — never hand-edited (plan/21 §6.0.B)
      - run: node scripts/gen-size-limits.mjs --check
      - run: node scripts/sync-sizes.mjs --check
      - run: node scripts/sync-bench.mjs --check
      - run: pnpm dlx publint
      - run: pnpm exec attw --pack .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 requires Node >=22 (uses node:sqlite); Node 20 is also EOL.
        # The published ESM artifact stays node-20-safe (engines: >=20) — we
        # just can't run the pnpm-11 dev toolchain on 20.
        node: [22, 24]
        react: ["18", "19"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pin React ${{ matrix.react }}
        # -w: the repo became a pnpm workspace when apps/* was added, so pnpm 11
        # requires an explicit workspace-root flag to add the React-matrix pin to
        # the root (lib) package (ERR_PNPM_ADDING_TO_ROOT otherwise).
        run: pnpm add -D -w react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  rsc:
    # Checkpoint 1 gate: static charts render server-side with zero client JS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # dist/ that the fixture imports
      - run: pnpm --filter @microcharts/fixture-next build
      - run: pnpm --filter @microcharts/fixture-next verify

  # Block PRs that introduce dependencies with known vulnerabilities. Only the
  # diff is scanned, so it needs the PR event's base/head — hence the guard.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
