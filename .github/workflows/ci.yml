name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      # All three render the built dist/, so they follow the build step.
      # craft:  text escapes / overlap / text-on-mark collisions across the catalog.
      # robust: every chart against the degenerate-input matrix — never throw,
      #         never leak a non-finite number into markup.
      # floor:  every chart stays legible down to half its default size — no
      #         overlapping or spilled labels at ordinary in-product sizes.
      - run: pnpm craft
      - run: pnpm robust
      - run: pnpm floor
      - run: pnpm knip
      - run: pnpm size
      # generated files must match their sources — never hand-edited
      - run: node scripts/gen-size-limits.mjs --check
      - run: node scripts/sync-sizes.mjs --check
      - run: node scripts/sync-bench.mjs --check
      - run: node scripts/sync-server-json.mjs --check
      - run: pnpm exec publint
      - run: pnpm exec attw --pack .
      # @microcharts/mcp — the sibling MCP server. Runs after the library build
      # above: its catalog-sync guard compares the committed snapshot against the
      # live registry + the built dist/styles.css, and its render tests import the
      # built @microcharts/react. The build must precede the tests — `dist.test.ts`
      # spawns the built `dist/cli.mjs` and hard-fails in CI if it is missing.
      - run: pnpm --filter @microcharts/mcp typecheck
      - run: pnpm --filter @microcharts/mcp build
      - run: pnpm --filter @microcharts/mcp test
      - run: pnpm --filter @microcharts/mcp exec publint
      - run: pnpm --filter @microcharts/mcp exec attw --pack .

  # A change to packages/mcp must ship with a changeset, or npm keeps serving a
  # stale embedded catalog — changesets does not cascade to a public dependent
  # whose `workspace:^` range still covers the new library version. Needs full
  # history to diff against the base branch, so it is its own small job.
  mcp-release-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      # setup-node activates the repo's `packageManager` via corepack, so pnpm
      # has to exist even though this job only runs a builtins-only node script.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: node scripts/check-mcp-changeset.mjs "origin/${{ github.base_ref }}"

  # Static + core-math suite (jsdom). Its output is pure `renderToStaticMarkup`
  # of deterministic geometry — identical on React 18 and 19 — so it runs ONCE,
  # off the React matrix, and needs no browser (no Playwright container / image
  # pull). React-version behaviour is covered by `test-browser` below.
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project core --project dom

  # Interactive entries — hooks, StrictMode double-invoke, useId — are the only
  # surface where React 18 vs 19 can diverge, so the matrix lives HERE.
  test-browser:
    runs-on: ubuntu-latest
    # Playwright's own image ships the browsers preinstalled and matched to
    # @playwright/test 1.61.1, so the browser vitest project needs no per-leg
    # `playwright install` download (same trick as visual.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    strategy:
      fail-fast: false
      matrix:
        # React is the runtime axis CLAUDE.md mandates (18 + 19, StrictMode on).
        # Node is fixed at 22 — the published ESM is node-20-safe ES2022, so the
        # Node version moves only the dev toolchain, not chart behaviour; the
        # container pins it. (Broader Node coverage, if ever wanted, belongs on a
        # main-only or nightly run, not every PR push.)
        react: ["18", "19"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pin React ${{ matrix.react }}
        # -w: the repo became a pnpm workspace when apps/* was added, so pnpm 11
        # requires an explicit workspace-root flag to add the React-matrix pin to
        # the root (lib) package (ERR_PNPM_ADDING_TO_ROOT otherwise).
        run: pnpm add -D -w react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: pnpm vitest run --project browser

  rsc:
    # Checkpoint 1 gate: static charts render server-side with zero client JS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # dist/ that the fixture imports
      - run: pnpm --filter @microcharts/fixture-next build
      - run: pnpm --filter @microcharts/fixture-next verify

  # Block PRs that introduce dependencies with known vulnerabilities. Only the
  # diff is scanned, so it needs the PR event's base/head — hence the guard.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
