name: Bug report
description: A chart renders wrong, crashes, or behaves unexpectedly.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected vs. what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The `data`, props, and chart used. A minimal snippet or link is ideal.
      render: tsx
    validations:
      required: true
  - type: input
    id: react
    attributes:
      label: React version
      placeholder: "19.0.0"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "@microcharts/react version"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: svg
    attributes:
      label: Produced SVG (optional)
      description: Paste the rendered markup if you can — it speeds up diagnosis.
      render: html
