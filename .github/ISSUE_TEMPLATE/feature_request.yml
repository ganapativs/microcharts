name: Feature / chart proposal
description: Propose a new chart type or capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: question
    attributes:
      label: What decision does it help a reader make?
      description: microcharts prefers uncommon questions over uncommon shapes. What signal does this communicate at a glance?
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Admission bar (for new chart types)
      description: |
        Confirm the fit (see plan/05, plan/15–17):
        - Reads at ≤ 200×60 px
        - Unique data story the catalog can't already answer
        - Honest primary encoding channel
        - Readable without training
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Anything else
