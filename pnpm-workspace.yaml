packages:
  # The published library lives at the repo root. It must be listed as an
  # explicit workspace member so Changesets/manypkg can version it — otherwise
  # `changeset version` fails: "Found changeset … for package @microcharts/react
  # which is not in the workspace" (manypkg excludes the implicit root package
  # from the versionable set). pnpm resolves the root member fine.
  - "."
  - "apps/*"
  - "packages/*"
  - "fixtures/*"

# pnpm 11 reads project settings from here (not .npmrc).
#
# This repo deliberately tracks bleeding-edge tooling (oxc, vitest, tsdown), and
# every dependency is freshness-vetted by hand before adoption, so pnpm 11's
# minimum-release-age supply-chain gate is disabled here only. Global and other
# repos keep their own policy.
minimumReleaseAge: 0

# Skip the pre-script dependency re-verification so `pnpm run <script>` doesn't
# re-run the policy check on every invocation.
verifyDepsBeforeRun: false

# Dependencies allowed to run install/build scripts (pnpm 11 blocks these by
# default). All are trusted CLI binaries that fetch their native executable
# (workerd = Cloudflare Workers runtime, via wrangler in the docs app).
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

# tsdown@0.22.4 still declares its `typescript` peer as ^5||^6, but builds and
# emits d.ts fine under TypeScript 7 (dts is generated via oxc, not tsc). Allow
# TS 7 to satisfy that peer so install stays warning-free; drop once tsdown
# widens its declared range.
peerDependencyRules:
  allowedVersions:
    "tsdown>typescript": "7"

# One Playwright runtime, and only one. This repo pins `playwright` and
# `@playwright/test` together with the CI container image (see ci.yml), but
# `@vitest/browser-playwright` declares its peer as `playwright: "*"`, which
# happily resolves a SECOND copy. Two runtimes in the tree and Playwright
# collects nothing at all — "did not expect test() to be called here", 0 of 104
# specs, on a message that names neither version.
#
# This lived in `package.json#pnpm.overrides` until pnpm 11.25, which stopped
# reading that field (silently — an ignored override does not fail an install).
overrides:
  playwright: "1.63.0"
