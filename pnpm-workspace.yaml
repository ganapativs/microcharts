packages:
  # The published library lives at the repo root. It must be listed as an
  # explicit workspace member so Changesets/manypkg can version it — otherwise
  # `changeset version` fails: "Found changeset … for package @microcharts/react
  # which is not in the workspace" (manypkg excludes the implicit root package
  # from the versionable set). pnpm resolves the root member fine.
  - "."
  - "apps/*"
  - "fixtures/*"

# pnpm 11 reads project settings from here (not .npmrc).
#
# This repo deliberately tracks bleeding-edge tooling (oxc, vitest, tsdown) that
# is freshness-vetted by hand per plan/12-research-audit.md, so pnpm 11's
# minimum-release-age supply-chain gate is disabled here only. Global and other
# repos keep their own policy.
minimumReleaseAge: 0

# Skip the pre-script dependency re-verification so `pnpm run <script>` doesn't
# re-run the policy check on every invocation.
verifyDepsBeforeRun: false

# Dependencies allowed to run install/build scripts (pnpm 11 blocks these by
# default). All are trusted CLI binaries that fetch their native executable
# (workerd = Cloudflare Workers runtime, via wrangler in the docs app).
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
